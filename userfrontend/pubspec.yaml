name: taxi_nanban
description: A complete taxi booking app like Uber.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  socket_io_client: ^3.0.0
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_polyline_points: ^2.0.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  font_awesome_flutter: ^11.0.0
  flutter_spinkit: ^5.2.0
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.3+2
  http: ^1.2.0
  uuid: ^4.3.3
  firebase_core: ^3.12.0
  firebase_auth: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/map_style.json
